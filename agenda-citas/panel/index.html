<!DOCTYPE html>
<html lang="es-VE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0906"><meta name="robots" content="noindex">
<title>Panel · Agenda de citas</title>
<link rel="icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
.dh{font-family:'Playfair Display',serif;font-size:18px;margin:16px 2px 8px;color:var(--gold2)}
.ct{display:flex;gap:12px;align-items:flex-start}
.ct .hr{flex:0 0 66px;text-align:center;border:1px solid var(--line2);border-radius:14px;padding:8px 4px;font-weight:700;color:var(--gold2);font-size:14px}
.ct .hr small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.ct .tx{flex:1;min-width:0}
.ct.pendiente .hr{background:var(--goldg);color:#1b1305;border-color:transparent}.ct.pendiente .hr small{color:#3b2a08}
.ct.cancelada{opacity:.55}
.dayrow{display:grid;grid-template-columns:40px 46px minmax(0,1fr) minmax(0,1fr);gap:7px;align-items:center;padding:7px 0;border-bottom:1px dashed rgba(212,175,55,.15)}
.dayrow:last-child{border-bottom:0}
.dayrow b{font-size:14px}
.dayrow input[type=time]{padding:9px 4px;font-size:13.5px;min-width:0;width:100%}
.dayrow.off input[type=time]{opacity:.35}
</style>
</head>
<body>
<div id="root"></div>
<script src="../config.js"></script>
<script src="../app.js"></script>
<script src="../nucleo.js"></script>
<script src="panel.js"></script>
<script>
(function(){
  const N = Nucleo, P = Panel, $ = N.$, $$ = N.$$, esc = N.esc;
  const DIAS_L = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  let SVC = [], filtro = "proximas";
  const money = n => N.money0(n, P.ajustes.moneda || "$");
  const fmt12 = t => { let [h, m] = String(t).split(":").map(Number); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return h + ":" + String(m).padStart(2, "0") + " " + ap; };
  const fLabel = f => { const d = new Date(f + "T12:00:00"); const hoy = N.hoyISO(); return (f === hoy ? "Hoy · " : "") + DIAS_L[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()]; };
  const telWa = t => { let d = N.waNum(t); if (d.startsWith("0")) d = "58" + d.slice(1); else if (d.length === 10) d = "58" + d; return d; };

  async function contarPend(){ try { const r = await P.db.select("agc_citas", { eq: { estado: "pendiente" }, gte: { fecha: N.hoyISO() }, cols: "id", limit: 99 }); P.badge("citas", r.length); } catch(e) {} }

  /* ---------------- Citas (tiempo real) ---------------- */
  async function vCitas(v){
    const hoy = N.hoyISO();
    const todas = await P.db.select("agc_citas", { order: [["fecha"], ["hora"]], limit: 500 });
    const F = {
      proximas: c => c.fecha >= hoy && c.estado !== "cancelada",
      pendiente: c => c.fecha >= hoy && c.estado === "pendiente",
      hoy: c => c.fecha === hoy,
      pasadas: c => c.fecha < hoy,
      cancelada: c => c.estado === "cancelada"
    };
    let lst = todas.filter(F[filtro]); if (filtro === "pasadas") lst.reverse();
    const pend = todas.filter(F.pendiente).length; P.badge("citas", pend);
    const grupos = {}; lst.forEach(c => (grupos[c.fecha] = grupos[c.fecha] || []).push(c));
    v.innerHTML = `<h2 class="t">Tus <span class="gold">citas</span></h2>
      <div class="kp"><div class="k"><span>Hoy</span><b class="gold">${todas.filter(c => c.fecha === hoy && c.estado !== "cancelada").length}</b></div><div class="k"><span>Por confirmar</span><b>${pend}</b></div></div>
      <div class="flt">${[["proximas","Próximas"],["pendiente","Por confirmar"],["hoy","Hoy"],["pasadas","Pasadas"],["cancelada","Canceladas"]].map(([k,l]) => `<button class="chip ${filtro===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>
      ${Object.keys(grupos).map(f => `<div class="dh">${fLabel(f)}</div>` + grupos[f].map(c => `<div class="box ct ${esc(c.estado)}">
        <div class="hr">${fmt12(c.hora).replace(" ", "<small>")}</small></div>
        <div class="tx"><div class="rw"><b>${esc(c.cliente)}</b><span class="pill ${esc(c.estado)}">${esc(c.estado)}</span></div>
          <small class="mut">${esc(c.servicio)} · ${c.duracion} min · ${money(c.precio)}</small><br><small class="mut">📱 ${esc(c.telefono)}</small>
          <div class="acts">${c.estado === "pendiente" ? `<button class="btn sm" data-e="confirmada" data-id="${c.id}">✅ Confirmar</button>` : ""}${c.estado === "confirmada" ? `<button class="btn sm dark" data-e="atendida" data-id="${c.id}">✔ Atendida</button>` : ""}${c.estado !== "cancelada" && c.estado !== "atendida" ? `<button class="btn sm dark" data-e="cancelada" data-id="${c.id}">✕ Cancelar</button>` : ""}
          <a class="btn sm dark" target="_blank" rel="noopener" href="https://wa.me/${telWa(c.telefono)}?text=${encodeURIComponent("Hola " + c.cliente + ", te escribimos de " + (P.ajustes.nombre || "") + " por tu cita del " + fLabel(c.fecha).replace("Hoy · ", "") + " a las " + fmt12(c.hora) + " (" + c.servicio + ").")}">💬</a></div></div>
      </div>`).join("")).join("") || `<div class="empty">No hay citas aquí.<br>Cuando un cliente reserve en tu agenda, aparecerá al instante con sonido 🔔.<br><br><a class="btn sm" href="${esc(N.ROOT)}" target="_blank" rel="noopener">Abrir mi agenda ↗</a></div>`}`;
    $$("[data-f]", v).forEach(b => b.onclick = () => { filtro = b.dataset.f; vCitas(v); });
    $$("[data-e]", v).forEach(b => b.onclick = () => P.ocupado(b, async () => {
      if (b.dataset.e === "cancelada" && !P.confirmar("¿Cancelar esta cita? La hora quedará libre para otros clientes.")) return;
      await P.db.update("agc_citas", { id: b.dataset.id }, { estado: b.dataset.e }); N.toast("✓ Cita " + b.dataset.e); vCitas(v);
    }));
  }

  /* ---------------- Servicios ---------------- */
  async function vServicios(v){
    SVC = await P.db.select("agc_servicios", { order: [["orden"], ["nombre"]] });
    v.innerHTML = `<div class="rw"><h2 class="t">Servicios</h2><button class="btn sm" id="addS">+ Servicio</button></div>
      ${SVC.length ? `<div class="box">${SVC.map((s, i) => `<div class="it ${s.activo ? "" : "off"}">${s.foto ? `<img class="th" src="${esc(N.img(s.foto))}" alt="" loading="lazy">` : `<div class="th"></div>`}
        <div class="tx"><b>${esc(s.nombre)}</b><span class="pr">${money(s.precio)}</span> <small>· ${s.duracion} min${s.activo ? "" : " · oculto"}</small></div>
        <button class="ib" data-up="${i}" ${i ? "" : "disabled"}>▲</button><button class="ib" data-es="${s.id}">✏️</button></div>`).join("")}</div>`
      : `<div class="empty">Aún no tienes servicios.<br><br><button class="btn sm" id="seed">✨ Cargar servicios de ejemplo</button></div>`}`;
    $("#addS").onclick = () => editar(null);
    $$("[data-es]", v).forEach(b => b.onclick = () => editar(SVC.find(s => s.id === b.dataset.es)));
    $$("[data-up]", v).forEach(b => b.onclick = () => P.ocupado(b, async () => { const i = +b.dataset.up, l = SVC.slice(); [l[i - 1], l[i]] = [l[i], l[i - 1]]; await Promise.all(l.map((s, k) => s.orden === k + 1 ? null : P.db.update("agc_servicios", { id: s.id }, { orden: k + 1 }))); vServicios(v); }));
    const sd = $("#seed"); if (sd) sd.onclick = () => P.ocupado(sd, async () => {
      const S = N.APP.seed; for (const s of S.agc_servicios) await P.db.upsert("agc_servicios", s);
      if (!P.ajustes.nombre) await P.guardarAjustes(S.agc_ajustes[0].datos);
      N.toast("✓ Servicios de ejemplo cargados"); P.refrescarTop(); vServicios(v);
    });
  }
  function editar(s){
    const nuevo = !s; s = s || { id: N.uid(), nombre: "", precio: "", duracion: 30, foto: "", etiqueta: "", activo: true, orden: SVC.length + 1 };
    P.modal(`<h3>${nuevo ? "Nuevo servicio" : "Editar servicio"}</h3>
      ${P.campo("sN", "Nombre", s.nombre, 'maxlength="80" placeholder="Ej: Corte + barba"')}
      <div class="row"><div>${P.campo("sP", "Precio", s.precio, 'type="number" step="0.01" min="0" inputmode="decimal"')}</div><div>${P.campo("sD", "Duración (min)", s.duracion, 'type="number" min="5" max="600" inputmode="numeric"')}</div></div>
      ${P.campo("sE", "Etiqueta (opcional)", s.etiqueta, 'maxlength="20" placeholder="Popular, Nuevo…"')}
      ${P.foto("sF", "Foto (se comprime sola a WebP liviano)", s.foto)}
      ${P.sw("sA", s.activo, "Visible en la agenda")}
      <button class="btn full" id="sG">Guardar servicio</button>
      ${nuevo ? "" : `<button class="btn red full" id="sB" style="margin-top:8px">Eliminar servicio</button>`}`, m => {
      $("#sG", m).onclick = e => P.ocupado(e.currentTarget, async () => {
        const nombre = P.v("sN"); if (!nombre) return N.toast("Escribe el nombre");
        const foto = await P.leerFoto("sF");
        const row = { id: s.id, nombre, precio: Math.max(0, P.num("sP")), duracion: Math.max(5, Math.min(600, Math.round(P.num("sD")) || 30)), etiqueta: P.v("sE"), foto, activo: P.v("sA"), orden: s.orden };
        if (nuevo) await P.db.insert("agc_servicios", row); else await P.db.update("agc_servicios", { id: s.id }, row);
        if (!nuevo && s.foto && s.foto !== foto) P.db.removeFile(s.foto);
        P.cerrar(); P.refrescar(); N.toast("✓ Servicio guardado");
      });
      const bb = $("#sB", m); if (bb) bb.onclick = e => P.ocupado(e.currentTarget, async () => {
        if (!P.confirmar("¿Eliminar “" + s.nombre + "”? Las citas ya hechas se conservan.")) return;
        await P.db.remove("agc_servicios", { id: s.id }); P.db.removeFile(s.foto); P.cerrar(); P.refrescar();
      });
    });
  }

  /* ---------------- Horario, turnos y días bloqueados ---------------- */
  async function vHorario(v){
    const H = P.ajustes.horario || {}, bl = await P.db.select("agc_bloqueos", { gte: { fecha: N.hoyISO() }, order: [["fecha"]] });
    const orden = [1, 2, 3, 4, 5, 6, 0];
    v.innerHTML = `<h2 class="t">Horario de <span class="gold">atención</span></h2>
      <div class="box"><h3>Horario semanal</h3>
        ${orden.map(i => { const d = H[i] || { abierto: false, desde: "09:00", hasta: "17:00" }; return `<div class="dayrow ${d.abierto ? "" : "off"}" data-d="${i}"><b>${DIAS_L[i].slice(0, 3)}</b>
          <label class="sw" style="margin:0"><input type="checkbox" id="hA${i}" ${d.abierto ? "checked" : ""}><span></span></label>
          <input type="time" id="hD${i}" value="${esc(d.desde || "09:00")}" aria-label="Desde"><input type="time" id="hH${i}" value="${esc(d.hasta || "17:00")}" aria-label="Hasta"></div>`; }).join("")}
        <div class="row" style="margin-top:6px"><div><label for="hI">Turno cada (min)</label><select id="hI">${[10,15,20,30,40,45,60,90,120].map(n => `<option ${+P.ajustes.intervalo === n ? "selected" : ""}>${n}</option>`).join("")}</select></div>
          <div>${P.campo("hX", "Días para reservar", P.ajustes.dias || 7, 'type="number" min="1" max="60" inputmode="numeric"')}</div></div>
        <p class="mut small" style="margin-top:8px">Apaga el interruptor en los días que no trabajas. Cada turno ocupa una hora de la lista; si un turno ya está reservado, nadie más puede tomarlo.</p>
        <button class="btn full fijo" id="hG">Guardar horario</button></div>
      <div class="box"><h3>Días bloqueados</h3><p class="mut small">Feriados, vacaciones o días libres: ese día no se puede reservar.</p>
        <div class="row"><div><label for="bF">Fecha</label><input type="date" id="bF" min="${N.hoyISO()}"></div><div><label for="bM">Motivo (opcional)</label><input id="bM" maxlength="80" placeholder="Feriado"></div></div>
        <button class="btn full" id="bA">+ Bloquear día</button>
        ${bl.map(b => `<div class="it"><div class="tx"><b>${fLabel(b.fecha)}</b><small>${esc(b.motivo || "Sin atención")}</small></div><button class="ib" data-del="${b.id}" title="Quitar">🗑</button></div>`).join("") || `<p class="mut small" style="margin-top:10px">No tienes días bloqueados.</p>`}
      </div>`;
    orden.forEach(i => $("#hA" + i).onchange = e => e.target.closest(".dayrow").classList.toggle("off", !e.target.checked));
    $("#hG").onclick = e => P.ocupado(e.currentTarget, async () => {
      const h = {}; for (const i of orden) { const d = P.v("hD" + i) || "09:00", t = P.v("hH" + i) || "17:00"; if (P.v("hA" + i) && t <= d) return N.toast("En " + DIAS_L[i] + " la hora de cierre debe ser después de la apertura"); h[i] = { abierto: P.v("hA" + i), desde: d, hasta: t }; }
      await P.guardarAjustes({ horario: h, intervalo: parseInt(P.v("hI"), 10) || 30, dias: Math.max(1, Math.min(60, parseInt(P.v("hX"), 10) || 7)) });
      N.toast("✓ Horario guardado");
    });
    $("#bA").onclick = e => P.ocupado(e.currentTarget, async () => {
      const f = P.v("bF"); if (!f) return N.toast("Elige una fecha");
      try { await P.db.insert("agc_bloqueos", { id: N.uid(), fecha: f, motivo: P.v("bM") }); } catch(x) { if (x.code === "23505") return N.toast("Ese día ya está bloqueado"); throw x; }
      N.toast("✓ Día bloqueado"); vHorario(v);
    });
    $$("[data-del]", v).forEach(b => b.onclick = () => P.ocupado(b, async () => { await P.db.remove("agc_bloqueos", { id: b.dataset.del }); vHorario(v); }));
  }

  /* ---------------- Ajustes ---------------- */
  async function vAjustes(v){
    const S = P.ajustes;
    v.innerHTML = `<h2 class="t">Ajustes del <span class="gold">negocio</span></h2><div class="box">
      ${P.campo("aN", "Nombre del negocio", S.nombre, 'maxlength="60"')}
      ${P.campo("aD", "Dirección", S.direccion, 'maxlength="100"')}
      ${P.campo("aW", "WhatsApp que recibe las citas", S.whatsapp, 'inputmode="tel" placeholder="584141234567 (58 + número, sin +)"')}
      ${P.campo("aM", "Símbolo de moneda (ej. $ o Bs.)", S.moneda || "$", 'maxlength="5"')}
      ${P.foto("aLg", "Logo (cuadrado)", S.logo, true)}
      ${P.foto("aPt", "Foto de portada", S.portada)}
      <button class="btn full fijo" id="aG">Guardar ajustes</button></div>`;
    $("#aG").onclick = e => P.ocupado(e.currentTarget, async () => {
      const w = N.waNum(P.v("aW")); if (w && w.length < 10) return N.toast("Revisa el WhatsApp: 58 + número (ej: 584141234567)");
      const logo = await P.leerFoto("aLg"), portada = await P.leerFoto("aPt");
      await P.guardarAjustes({ nombre: P.v("aN"), direccion: P.v("aD"), whatsapp: w, moneda: P.v("aM") || "$", logo, portada });
      N.toast("✓ Ajustes guardados"); P.refrescarTop(); vAjustes(v);
    });
  }

  P.iniciar({
    tablaCheck: "agc_citas",
    async alEntrar(){
      await P.cargarAjustes();
      if (!P.ajustes.horario) { const h = {}; for (let i = 0; i < 7; i++) h[i] = { abierto: i !== 0, desde: "09:00", hasta: "17:00" }; P.ajustes.horario = h; P.ajustes.intervalo = P.ajustes.intervalo || 30; P.ajustes.dias = P.ajustes.dias || 7; }
      P.db.subscribe("agc_citas", ev => {
        if (ev.tipo === "insert" && ev.row) N.notify("🔔 Nueva cita", (ev.row.cliente || "") + " · " + fLabel(ev.row.fecha) + " " + fmt12(ev.row.hora));
        if (P.tab === "citas") { const v = $("#v"); if (v && !$("#modal")) vCitas(v); } else contarPend();
      });
      contarPend();
    },
    tabs: [
      { id: "citas", ic: "📅", lbl: "Citas", render: vCitas },
      { id: "servicios", ic: "✂️", lbl: "Servicios", render: vServicios },
      { id: "horario", ic: "🕒", lbl: "Horario", render: vHorario },
      { id: "ajustes", ic: "⚙️", lbl: "Ajustes", render: vAjustes }
    ]
  });
})();
</script>
</body>
</html>
