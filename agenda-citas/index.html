<!DOCTYPE html>
<html lang="es-VE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda tu cita · Barbería Los Andes</title>
<meta name="description" content="Agenda tu cita en línea: elige servicio, día y hora en segundos.">
<meta name="theme-color" content="#0b0906">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../vendedor/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   CONFIGURACIÓN DEL NEGOCIO  ·  Edita solo esta sección
   ---------------------------------------------------------------------
   - whatsapp: número que recibe las citas (58 + número, sin "+").
   - services: tus servicios con precio, duración (min) y foto.
   - schedule: hora de apertura/cierre (formato 24h), cada cuántos
     minutos hay un turno y qué días cierras (0 = domingo … 6 = sábado).
   - daysAhead: cuántos días se pueden reservar por adelantado.
   Las citas se guardan en este teléfono (localStorage) para marcar
   las horas ocupadas en esta demo.
   ---------------------------------------------------------------------
   ¿Quieres que todos tus clientes vean las horas ocupadas en tiempo
   real? Conecta tu propia base de datos (Supabase, Firebase, Google
   Sheets…) en las funciones loadBookings() y saveBooking() de abajo.
   ===================================================================== */
const CONFIG = {
  name: "Barbería Los Andes",
  address: "Av. 4 Bolívar, Mérida",
  whatsapp: "584140000000",
  currency: "$",
  heroImg: "https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=900&q=70&auto=format&fit=crop",
  services: [
    { id: "clasico", name: "Corte clásico",   price: 5, minutes: 30,
      img: "https://images.unsplash.com/photo-1622296089863-eb7fc530daa8?w=500&q=70&auto=format&fit=crop" },
    { id: "barba",   name: "Corte + barba",   price: 8, minutes: 45, tag: "Popular",
      img: "https://images.unsplash.com/photo-1532710093739-9470acff878f?w=500&q=70&auto=format&fit=crop" },
    { id: "fade",    name: "Degradado (fade)", price: 6, minutes: 40,
      img: "https://images.unsplash.com/photo-1593702275687-f8b402bf1fb5?w=500&q=70&auto=format&fit=crop" },
    { id: "afeitado",name: "Afeitado",         price: 4, minutes: 20,
      img: "https://images.unsplash.com/photo-1517832606299-7ae9b720a186?w=500&q=70&auto=format&fit=crop" }
  ],
  schedule: { open: "09:00", close: "17:00", everyMinutes: 45, closedDays: [0] },
  daysAhead: 7,
  demoBusySlots: true   // marca algunas horas como ocupadas para que la demo se vea real
};
</script>
<style>
:root{--bg:#0b0906;--card:#15110b;--line:rgba(212,175,55,.28);--line2:rgba(212,175,55,.6);--gold:#d4af37;--gold2:#f3d97a;--goldg:linear-gradient(135deg,#f7e48c 0%,#d4af37 48%,#a9851f 100%);--txt:#f5edd9;--mut:#a99d82}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:'Poppins',system-ui,sans-serif;font-size:15px;line-height:1.45;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:120px;
  background:radial-gradient(120% 50% at 50% 0%,rgba(212,175,55,.10),transparent 60%),var(--bg)}
.serif{font-family:'Playfair Display',Georgia,serif}
.gold{background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent}
button,input{font-family:inherit}
button{cursor:pointer}
img{display:block}
.hero{position:relative;height:200px;overflow:hidden;border-radius:0 0 26px 26px}
.hero img{width:100%;height:100%;object-fit:cover;filter:brightness(.5)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,9,6,.1),var(--bg) 100%)}
.hero-in{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.3px;background:rgba(11,9,6,.6);border:1px solid var(--line2);color:var(--gold2);backdrop-filter:blur(6px)}
.hero h1{font-size:30px;line-height:1.1;font-weight:800;margin-top:10px}
.hero p{font-size:13px;color:#d9cfb6;margin-top:3px}
.wrap{padding:0 16px}
.stepH{display:flex;align-items:center;gap:10px;margin:24px 2px 12px}
.stepH .n{width:28px;height:28px;border-radius:50%;background:var(--goldg);color:#1b1305;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stepH .n.off{background:#1e170d;color:var(--gold2);border:1px solid var(--line2)}
.stepH h2{font-size:21px}
.stepH small{margin-left:auto;color:var(--mut);font-size:12px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sv{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);text-align:left;color:var(--txt);padding:0;transition:border-color .2s,transform .15s}
.sv:active{transform:scale(.98)}
.sv img{width:100%;height:104px;object-fit:cover}
.sv .b{padding:9px 11px 11px}
.sv h3{font-size:14px;font-weight:600;line-height:1.25}
.sv .m{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:12px;color:var(--mut)}
.sv .m b{font-family:'Playfair Display',serif;font-size:17px;color:var(--gold2)}
.sv .tag{position:absolute;top:8px;left:8px;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--goldg);color:#1b1305}
.sv .ok{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--goldg);display:none;align-items:center;justify-content:center}
.sv.on{border:1.5px solid var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.sv.on .ok{display:flex}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 56px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--txt);padding:9px 0 8px;text-align:center}
.day .w{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.day .d{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;line-height:1.15}
.day .mo{font-size:11px;color:var(--mut)}
.day.on{background:var(--goldg);border-color:transparent;color:#1b1305}
.day.on .w,.day.on .mo{color:#3b2a08}
.day:disabled{opacity:.38;cursor:not-allowed}
.day:disabled .mo{color:#c66}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.h{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--txt);padding:11px 0;font-size:14px;font-weight:500}
.h.on{background:var(--goldg);color:#1b1305;border-color:transparent;font-weight:700}
.h:disabled{color:#5b5240;background:#0f0c08;border-style:dashed;text-decoration:line-through;cursor:not-allowed}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hint{color:var(--mut);font-size:13px;padding:14px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--mut);margin:0 0 5px 4px}
.field input{width:100%;background:#0f0c08;border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--txt);font-size:15px}
.field input:focus{outline:none;border-color:var(--gold)}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;padding:12px 16px 16px;background:linear-gradient(180deg,rgba(11,9,6,0) 0,rgba(11,9,6,.97) 22px,var(--bg) 100%);z-index:30}
.cta .sum{font-size:12px;color:var(--mut);text-align:center;margin-bottom:8px;min-height:18px}
.btn{width:100%;border:0;border-radius:999px;background:var(--goldg);color:#1b1305;padding:15px;font-size:15.5px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.btn:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line2);box-shadow:none;margin-top:10px}
.btn svg{width:20px;height:20px}
.done{position:fixed;inset:0;z-index:80;overflow:auto;background:radial-gradient(90% 60% at 50% 15%,rgba(212,175,55,.16),transparent 65%),var(--bg);display:none;padding:40px 22px 30px}
.done.show{display:block}
.done .in{max-width:400px;margin:0 auto;text-align:center}
.check{width:88px;height:88px;margin:0 auto;border-radius:50%;background:var(--goldg);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(212,175,55,.12),0 0 0 22px rgba(212,175,55,.06);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.done h2{font-size:31px;margin-top:26px}
.done .s{color:var(--mut);font-size:14px;margin-top:4px}
.ticket{margin:22px 0 16px;border:1px solid var(--line2);border-radius:22px;overflow:hidden;background:#130f09;text-align:left}
.ticket .top{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px dashed rgba(212,175,55,.3)}
.ticket .top img{width:58px;height:58px;border-radius:14px;object-fit:cover}
.ticket .top b{font-size:16px}
.ticket .top small{display:block;color:var(--mut);font-size:12px}
.ticket .r{display:flex;justify-content:space-between;padding:9px 16px;font-size:14px}
.ticket .r span:first-child{color:var(--mut)}
.ticket .r.t{border-top:1px dashed rgba(212,175,55,.3);padding:12px 16px 14px}
.ticket .r.t span:last-child{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold2);font-weight:700}
.note{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--gold2);margin-top:14px}
.foot{text-align:center;color:#6f664f;font-size:11.5px;margin:28px 0 0}
</style>
</head>
<body>
<header class="hero">
  <img id="heroImg" alt="Interior de la barbería">
  <div class="hero-in">
    <span class="pill">✂️ Reserva en línea · 24/7</span>
    <h1 class="serif" id="bizName"></h1>
    <p id="bizAddr"></p>
  </div>
</header>

<main class="wrap">
  <div class="stepH"><span class="n" id="n1">1</span><h2 class="serif">Elige el servicio</h2></div>
  <div class="svc" id="svc"></div>

  <div class="stepH"><span class="n off" id="n2">2</span><h2 class="serif">Elige el día</h2><small id="monthLbl"></small></div>
  <div class="days" id="days"></div>

  <div class="stepH"><span class="n off" id="n3">3</span><h2 class="serif">Hora disponible</h2></div>
  <div id="hoursBox"></div>

  <div class="stepH"><span class="n off" id="n4">4</span><h2 class="serif">Tus datos</h2></div>
  <div class="field"><label for="nm">Tu nombre</label><input id="nm" autocomplete="name" placeholder="Ej: Carlos Pérez"></div>
  <div class="field"><label for="tel">Teléfono (WhatsApp)</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej: 0414 123 4567"></div>
  <p class="foot">Agenda demo · Hecha con IA por DUNIGSHOP</p>
</main>

<div class="cta"><div class="sum" id="sum">Elige servicio, día y hora</div><button class="btn" id="confirm" disabled>Confirmar cita</button></div>

<section class="done" id="done">
  <div class="in">
    <div class="check"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1b1305" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 class="serif">¡Cita <span class="gold">confirmada!</span></h2>
    <p class="s">Te esperamos en <span id="dAddr"></span></p>
    <div class="ticket" id="ticket"></div>
    <button class="btn" id="wa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.6-.1 1.2Z"/></svg>Enviar cita por WhatsApp</button>
    <button class="btn ghost" id="newB">Agendar otra cita</button>
    <p class="note">🔔 Te enviaremos un recordatorio por WhatsApp</p>
  </div>
</section>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const money = n => CONFIG.currency + Number(n).toFixed(2).replace(/\.00$/, "");
  const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const DIAS_L = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const KEY = "agenda_bookings";
  const st = { svc: null, day: null, time: null };

  $("#heroImg").src = CONFIG.heroImg;
  $("#bizName").textContent = CONFIG.name;
  $("#bizAddr").textContent = "📍 " + CONFIG.address;
  $("#dAddr").textContent = CONFIG.address;
  document.title = "Agenda tu cita · " + CONFIG.name;

  // 👉 Base de datos propia: reemplaza estas dos funciones por llamadas a tu API.
  function loadBookings(){ try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e) { return []; } }
  function saveBooking(b){ const all = loadBookings(); all.push(b); localStorage.setItem(KEY, JSON.stringify(all)); }

  const pad = n => String(n).padStart(2,"0");
  const ymd = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
  const fmt12 = min => { let h = Math.floor(min/60), m = min%60; const ap = h >= 12 ? "pm" : "am"; h = h%12 || 12; return h + ":" + pad(m) + " " + ap; };

  // Servicios
  const svcBox = $("#svc");
  CONFIG.services.forEach(s => {
    const b = document.createElement("button"); b.className = "sv"; b.dataset.id = s.id;
    b.innerHTML = `<img src="${s.img}" alt="${s.name}" loading="lazy">${s.tag ? `<span class="tag">${s.tag}</span>` : ""}
      <span class="ok"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1b1305" stroke-width="3.5"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <div class="b"><h3>${s.name}</h3><div class="m"><span>⏱ ${s.minutes} min</span><b>${money(s.price)}</b></div></div>`;
    b.onclick = () => { st.svc = s; render(); };
    svcBox.appendChild(b);
  });

  // Días
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for (let i = 0; i < CONFIG.daysAhead; i++) { const d = new Date(today); d.setDate(today.getDate()+i); days.push(d); }
  const daysBox = $("#days");
  days.forEach((d, i) => {
    const closed = CONFIG.schedule.closedDays.includes(d.getDay());
    const b = document.createElement("button"); b.className = "day"; b.dataset.k = ymd(d); b.disabled = closed;
    b.innerHTML = `<div class="w">${i === 0 ? "Hoy" : DIAS[d.getDay()]}</div><div class="d">${d.getDate()}</div><div class="mo">${closed ? "Cerrado" : MESES[d.getMonth()]}</div>`;
    b.onclick = () => { st.day = d; st.time = null; render(); };
    daysBox.appendChild(b);
  });
  $("#monthLbl").textContent = MESES_L[today.getMonth()] + " " + today.getFullYear();
  // Preselecciona el primer día abierto
  st.day = days.find(d => !CONFIG.schedule.closedDays.includes(d.getDay())) || null;

  // Horas
  const slots = [];
  for (let m = toMin(CONFIG.schedule.open); m + 30 <= toMin(CONFIG.schedule.close); m += CONFIG.schedule.everyMinutes) slots.push(m);

  function busy(dayKey){
    const set = new Set(loadBookings().filter(b => b.day === dayKey).map(b => b.time));
    if (CONFIG.demoBusySlots) { // ocupadas "de ejemplo", siempre las mismas para cada fecha
      let seed = dayKey.split("-").join("") % 9973;
      slots.forEach(s => { seed = (seed * 9301 + 49297) % 233280; if (seed / 233280 < 0.25) set.add(s); });
    }
    return set;
  }

  function renderHours(){
    const box = $("#hoursBox");
    if (!st.day) { box.innerHTML = `<p class="hint">Primero elige un día</p>`; return; }
    const k = ymd(st.day), taken = busy(k);
    const now = new Date(), isToday = k === ymd(now), nowMin = now.getHours()*60 + now.getMinutes();
    const free = slots.filter(s => !taken.has(s) && !(isToday && s <= nowMin + 15));
    if (!free.length) { box.innerHTML = `<p class="hint">No quedan horas libres este día. Prueba con otro día 👆</p>`; return; }
    box.innerHTML = `<div class="hours">${slots.map(s => {
      const off = taken.has(s) || (isToday && s <= nowMin + 15);
      return `<button class="h ${st.time === s ? "on" : ""}" data-t="${s}" ${off ? "disabled" : ""}>${fmt12(s)}</button>`;
    }).join("")}</div>
    <div class="legend"><span><i style="background:var(--goldg)"></i>Seleccionada</span><span><i style="border:1px solid var(--line);background:#15110b"></i>Libre</span><span><i style="border:1px dashed var(--line);background:#0f0c08"></i>Ocupada</span></div>`;
    box.querySelectorAll(".h:not([disabled])").forEach(b => b.onclick = () => { st.time = Number(b.dataset.t); render(); });
  }

  const dayLabel = d => DIAS_L[d.getDay()].replace(/^./, c => c.toUpperCase()) + " " + d.getDate() + " de " + MESES_L[d.getMonth()];
  const valid = () => st.svc && st.day && st.time != null && $("#nm").value.trim().length >= 2 && $("#tel").value.replace(/\D/g,"").length >= 7;

  function render(){
    svcBox.querySelectorAll(".sv").forEach(b => b.classList.toggle("on", st.svc && b.dataset.id === st.svc.id));
    daysBox.querySelectorAll(".day").forEach(b => b.classList.toggle("on", st.day && b.dataset.k === ymd(st.day)));
    renderHours();
    $("#n2").classList.toggle("off", !st.svc); $("#n3").classList.toggle("off", !(st.svc && st.day));
    $("#n4").classList.toggle("off", st.time == null);
    const parts = [];
    if (st.svc) parts.push(st.svc.name + " · " + money(st.svc.price));
    if (st.day) parts.push(DIAS[st.day.getDay()] + " " + st.day.getDate() + " " + MESES[st.day.getMonth()]);
    if (st.time != null) parts.push(fmt12(st.time));
    $("#sum").textContent = parts.length ? parts.join("  •  ") : "Elige servicio, día y hora";
    $("#confirm").disabled = !valid();
    $("#confirm").textContent = !st.svc ? "Elige un servicio" : st.time == null ? "Elige una hora" : !valid() ? "Escribe tu nombre y teléfono" : "Confirmar cita";
  }
  $("#nm").addEventListener("input", render); $("#tel").addEventListener("input", render);

  let last = null;
  $("#confirm").onclick = () => {
    if (!valid()) return;
    const k = ymd(st.day);
    if (busy(k).has(st.time)) { alert("Esa hora acaba de ocuparse, elige otra."); st.time = null; render(); return; }
    last = { svc: st.svc, day: new Date(st.day), time: st.time, name: $("#nm").value.trim(), tel: $("#tel").value.trim() };
    saveBooking({ day: k, time: st.time, svc: st.svc.id, name: last.name, tel: last.tel, at: Date.now() });
    const end = st.time + st.svc.minutes;
    $("#ticket").innerHTML = `<div class="top"><img src="${st.svc.img}" alt=""><div><b>${st.svc.name}</b><small>${st.svc.minutes} min · ${CONFIG.name}</small></div></div>
      <div class="r"><span>Servicio</span><span>${st.svc.name}</span></div>
      <div class="r"><span>Día</span><span>${dayLabel(st.day)}</span></div>
      <div class="r"><span>Hora</span><span>${fmt12(st.time)} – ${fmt12(end)}</span></div>
      <div class="r"><span>Cliente</span><span>${last.name.replace(/</g,"&lt;")}</span></div>
      <div class="r t"><span>Total</span><span>${money(st.svc.price)}</span></div>`;
    $("#done").classList.add("show"); $("#done").scrollTop = 0;
  };
  $("#wa").onclick = () => {
    if (!last) return;
    let msg = `💈 *Nueva cita · ${CONFIG.name}*\n\n`;
    msg += `✂️ Servicio: *${last.svc.name}* (${last.svc.minutes} min)\n`;
    msg += `📅 Día: *${dayLabel(last.day)}*\n🕒 Hora: *${fmt12(last.time)}*\n`;
    msg += `👤 Cliente: ${last.name}\n📱 Teléfono: ${last.tel}\n\n💰 Total: *${money(last.svc.price)}*\n📍 ${CONFIG.address}\n\n_Reservado desde la agenda en línea_`;
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
  };
  $("#newB").onclick = () => { $("#done").classList.remove("show"); st.time = null; render(); window.scrollTo({top:0}); };

  render();
})();
</script>
</body>
</html>
